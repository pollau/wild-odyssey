name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      # main => production ; qa => environnement nomme permanent (URL stable)
      - main
      - qa
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_UMAMI_SITE_ID: ${{ github.ref == 'refs/heads/main' && secrets.UMAMI_SITE_ID_PROD || '' }}
          # main => production (aucune pastille, indexable) ; toute PR => preview
          # (pastille QA + noindex). Voir src/layouts/Layout.astro.
          PUBLIC_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_WATER_05ECDB603 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "dist" # App source code path
          api_location: "api" # Azure Functions (contact form email)
          output_location: "" # Built app content directory - optional
          skip_app_build: true
          # Seul main deploie en production. La branche qa alimente un
          # environnement nomme "qa" a URL stable (a declarer une fois dans
          # Keystatic Cloud) ; les PR gardent leurs previews ephemeres.
          production_branch: "main"
          deployment_environment: ${{ github.ref == 'refs/heads/qa' && 'qa' || '' }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_WATER_05ECDB603 }}
          action: "close"
